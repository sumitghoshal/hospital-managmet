name: CI-CD
on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  id-token: write      # OIDC to AWS (no static keys)
  contents: write      # commit new image tag for ArgoCD

env:
  AWS_REGION: ap-southeast-2
  ECR_REPO: hms

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install & syntax check
        working-directory: app
        run: |
          npm install
          node --check server.js

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${GITHUB_SHA::8}
          docker build -t "$IMAGE" app
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Update manifest (GitOps) – ArgoCD picks it up
        run: |
          sed -i "s|image: .*amazonaws.com/hms:.*|image: ${IMAGE}|" k8s/deployment.yaml
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git commit -am "deploy: ${IMAGE} [skip ci]" || echo "no change"
          git push
