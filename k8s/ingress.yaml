# AWS Load Balancer Controller creates the ALB; ExternalDNS creates the Route 53 record.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hms
  namespace: hms
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    external-dns.alpha.kubernetes.io/hostname: hms.sumitops.online
spec:
  ingressClassName: alb
  tls:
    - hosts: [hms.sumitops.online]     # ALB auto-discovers the matching ACM certificate
  rules:
    - host: hms.sumitops.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hms
                port: { number: 80 }
